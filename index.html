oraciones en vivo, talleres gastronómicos y actividades participativas · Organiza: Caja Rural de Zamora","registration":false,"paid":false,"links":[],"end":null}];
const DAY_ORDER=['Jueves 17','Viernes 18','Sábado 19','Domingo 20'];
const GROUPS=['Todo','Catas y degustaciones','Espectáculos','Infantil','Talleres','Profesional','Concursos y premios','Actos oficiales','Otros'];
const STORE='fromago-plan-v1';
const PEOPLE={a:'Alfonso',b:'Belén',c:'Elena'};
const defaultState={a:[],b:[],c:[],buffer:45,view:'program',day:'Todos',group:'Todo',query:'',regOnly:false,loc:''};
let state=loadState(); let imported=false;
function loadState(){try{return {...defaultState,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){return {...defaultState}}}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function esc(s=''){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}
function mins(t){if(!/^\d\d?:\d\d$/.test(t))return null;let[h,m]=t.split(':').map(Number);return h*60+m}
function fmtDay(d){return d.replace('Jueves','Jue').replace('Viernes','Vie').replace('Sábado','Sáb').replace('Domingo','Dom')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function personHas(p,id){return state[p].includes(id)}
function personName(p){return PEOPLE[p]||p}
function chosenPeople(id){return Object.keys(PEOPLE).filter(p=>personHas(p,id)).map(personName)}
function toggleFav(p,id){const arr=state[p];const i=arr.indexOf(id);i>=0?arr.splice(i,1):arr.push(id);save();render();}
function firstLink(a){return a.links&&a.links.length?a.links[0]:null}
function card(a,extra=''){
 const A=personHas('a',a.id),B=personHas('b',a.id),C=personHas('c',a.id),lnk=firstLink(a);
 return `<article class="card ${a.time==='Todo el día'?'allDay':''}"><div class="topline"><span class="badge">${esc(a.category)}</span><span class="time">${esc(a.time)}${a.end?'–'+esc(a.end):''}</span></div><div class="title">${esc(a.title)}</div><div class="meta"><strong>📍 ${esc(a.location)}</strong>${a.registration?' · ✍️ Inscripción':''}${a.paid?' · 💳 De pago':''}</div>${a.details?`<div class="details">${esc(a.details)}</div>`:''}${extra}<div class="actions"><button class="fav ${A?'on':''}" onclick="toggleFav('a',${a.id})">${A?'♥':'♡'} Alfonso</button><button class="fav ${B?'on':''}" onclick="toggleFav('b',${a.id})">${B?'♥':'♡'} Belén</button><button class="fav ${C?'on':''}" onclick="toggleFav('c',${a.id})">${C?'♥':'♡'} Elena</button>${lnk?`<a class="linkbtn ${a.registration?'reg':''}" href="${esc(lnk.url)}" target="_blank" rel="noopener">${a.registration?'Inscripción ↗':'Enlace ↗'}</a>`:''}</div></article>`
}
function setGroup(g){state.group=g;save();setupFilters();render()}
function setupFilters(){
 document.getElementById('daychips').innerHTML=['Todos',...DAY_ORDER].map(d=>`<button class="chip ${state.day===d?'active':''}" onclick="state.day='${d}';save();setupFilters();render()">${d==='Todos'?'Todos':fmtDay(d)}</button>`).join('');
 document.getElementById('catchips').innerHTML=GROUPS.map(g=>`<button class="chip ${state.group===g?'active':''}" onclick="setGroup('${g}')">${g}</button>`).join('');
 const locs=[...new Set(ACTIVITIES.map(a=>a.location))].sort((x,y)=>x.localeCompare(y,'es'));
 const sel=document.getElementById('locfilter');sel.innerHTML='<option value="">Todos los espacios</option>'+locs.map(l=>`<option ${state.loc===l?'selected':''}>${esc(l)}</option>`).join('');
 document.getElementById('search').value=state.query||'';document.getElementById('regOnly').checked=!!state.regOnly;
}
function filtered(){let q=(state.query||'').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'');return ACTIVITIES.filter(a=>{
 let hay=[a.title,a.location,a.details,a.category,a.group].join(' ').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'');
 return (state.day==='Todos'||a.day===state.day)&&(state.group==='Todo'||a.group===state.group)&&(!q||hay.includes(q))&&(!state.regOnly||a.registration)&&(!state.loc||a.location===state.loc)
})}
function renderProgram(){
 const arr=filtered(),app=document.getElementById('app');document.getElementById('countpill').textContent=`${arr.length} de 221`;
 let out=`<div class="notice">Programa provisional. Se muestran las 221 actividades de la programación oficial que has guardado. Los horarios pueden cambiar y la mayoría de fichas no indican duración.</div>`;
 if(!arr.length){app.innerHTML=out+'<div class="empty">No hay actividades con estos filtros.</div>';return}
 for(const day of DAY_ORDER){const items=arr.filter(a=>a.day===day);if(!items.length)continue;out+=`<div class="sectiontitle"><h2>${day}</h2><span>${items.length} actividades</span></div><div class="cardsgrid">`;
 let last=null;for(const a of items){if(a.time!==last){out+=`<div class="slot">${a.time}</div>`;last=a.time}out+=card(a)}out+='</div>'}
 app.innerHTML=out;
}
function selectedActivities(){const ids=new Set([...state.a,...state.b,...state.c]);return ACTIVITIES.filter(a=>ids.has(a.id))}
function renderFavorites(){
 document.getElementById('countpill').textContent=`${new Set([...state.a,...state.b,...state.c]).size} elegidas`;
 const arr=selectedActivities();const shared=arr.filter(a=>chosenPeople(a.id).length>=2).length;
 let out=`<div class="stats"><div class="stat"><b>${state.a.length}</b><span>Alfonso</span></div><div class="stat"><b>${state.b.length}</b><span>Belén</span></div><div class="stat"><b>${state.c.length}</b><span>Elena</span></div><div class="stat"><b>${shared}</b><span>Coincidencias</span></div></div><div class="sharebox"><button class="primary" onclick="sharePlan()">Compartir plan</button><button class="secondary" onclick="shareText()">Compartir itinerario</button></div>`;
 if(imported)out+=`<div class="imported">✓ Plan recibido desde un enlace compartido. Puedes modificarlo y volver a compartirlo.</div>`;
 if(!arr.length){out+='<div class="empty">Marca actividades con ♡ en el programa y aparecerán aquí.</div>';document.getElementById('app').innerHTML=out;return}
 for(const day of DAY_ORDER){const items=arr.filter(a=>a.day===day).sort(sortActs);if(!items.length)continue;out+=`<div class="sectiontitle"><h2>${day}</h2><span>${items.length}</span></div>`;for(const a of items){let who=`<div class="who">${chosenPeople(a.id).map(n=>`<span>${esc(n)}</span>`).join('')}</div>`;out+=card(a,`<div class="details">Elegida por ${who}</div>`)} }
 document.getElementById('app').innerHTML=out;
}
function sortActs(a,b){let da=DAY_ORDER.indexOf(a.day)-DAY_ORDER.indexOf(b.day);if(da)return da; if(a.time==='Todo el día')return 1;if(b.time==='Todo el día')return -1;return (mins(a.time)||9999)-(mins(b.time)||9999)}
function conflictMap(){const map={}; for(const p of ['a','b','c']){for(const day of DAY_ORDER){let xs=ACTIVITIES.filter(a=>a.day===day&&state[p].includes(a.id)&&a.time!=='Todo el día').sort(sortActs);for(let i=0;i<xs.length;i++)for(let j=i+1;j<xs.length;j++){
 const x=xs[i],y=xs[j],sx=mins(x.time),sy=mins(y.time);if(sx==null||sy==null)continue; let hard=false,soft=false,reason=''; const ex=x.end?mins(x.end):null;
 if(sx===sy){hard=true;reason=`empiezan a la misma hora (${x.time})`} else if(ex!=null&&sy<ex){hard=true;reason=`${x.title} figura hasta las ${x.end}`} else if(sy-sx<state.buffer){soft=true;reason=`solo hay ${sy-sx} min entre los inicios`}
 if(hard||soft){for(const a of [x,y]){map[a.id]=map[a.id]||[];map[a.id].push({p,hard,reason,other:a.id===x.id?y.title:x.title})}}
 }} } return map}
function renderItinerary(){
 const arr=selectedActivities().sort(sortActs),cm=conflictMap();document.getElementById('countpill').textContent=`${arr.length} en el plan`;
 let hard=0,soft=0;Object.values(cm).flat().forEach(x=>x.hard?hard++:soft++);hard=Math.ceil(hard/2);soft=Math.ceil(soft/2);
 let out=`<div class="settings"><label>Margen para avisos entre actividades <select onchange="state.buffer=+this.value;save();render()">${[15,30,45,60,90].map(v=>`<option value="${v}" ${state.buffer===v?'selected':''}>${v} min</option>`).join('')}</select></label></div><div class="legend"><b>Conflicto rojo:</b> misma hora o solape confirmado por un horario final publicado. <b>Aviso ámbar:</b> no es un solape confirmado; FROMAGO no publica duración para la mayoría de actividades y usamos el margen elegido entre horas de inicio. Los avisos se calculan por separado para Alfonso, Belén y Elena, por lo que podéis dividiros.</div>`;
 if(hard||soft)out+=`<div class="notice"><b>${hard} conflicto${hard===1?'':'s'} claro${hard===1?'':'s'}</b> · ${soft} aviso${soft===1?'':'s'} de margen.</div>`;
 if(!arr.length){out+='<div class="empty">Todavía no hay actividades en vuestro plan.</div>';document.getElementById('app').innerHTML=out;return}
 for(const day of DAY_ORDER){const items=arr.filter(a=>a.day===day);if(!items.length)continue;out+=`<div class="sectiontitle"><h2>${day}</h2><span>${items.length}</span></div>`;for(const a of items){let extras='';if(cm[a.id]){const seen=new Set();for(const c of cm[a.id]){const key=c.p+'|'+c.hard+'|'+c.other;if(seen.has(key))continue;seen.add(key);extras+=`<div class="conflict ${c.hard?'hard':'soft'}">${c.hard?'⛔':'⏱️'} ${esc(personName(c.p))}: ${esc(c.reason)} · también “${esc(c.other)}”</div>`}}out+=card(a,extras)} }
 document.getElementById('app').innerHTML=out;
}
function render(){document.getElementById('programFilters').style.display=state.view==='program'?'block':'none';document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view)); if(state.view==='program')renderProgram();else if(state.view==='favorites')renderFavorites();else renderItinerary();}
function enc(obj){return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}
function shareUrl(){const base=location.href.split('#')[0];return base+'#p='+enc({a:state.a,b:state.b,c:state.c,buffer:state.buffer})}
async function sharePlan(){const url=shareUrl(),data={title:'Nuestro plan de FROMAGO',text:'Te comparto nuestra selección de FROMAGO 2026',url};try{if(navigator.share&&location.protocol!=='file:')await navigator.share(data);else{await navigator.clipboard.writeText(url);toast('Enlace del plan copiado')}}catch(e){}}
function itineraryText(){let arr=selectedActivities().sort(sortActs),lines=['🧀 FROMAGO 2026 · Nuestro plan'];let cur='';for(const a of arr){if(a.day!==cur){cur=a.day;lines.push('',`— ${cur} —`)}let who=chosenPeople(a.id).join(', ');lines.push(`${a.time} · ${a.title} · ${a.location} · ${who}`)}return lines.join('\n')}
async function shareText(){let text=itineraryText();try{if(navigator.share)await navigator.share({title:'Itinerario FROMAGO',text});else{await navigator.clipboard.writeText(text);toast('Itinerario copiado')}}catch(e){}}
function importHash(){if(!location.hash.startsWith('#p='))return;try{const x=dec(location.hash.slice(3));if(Array.isArray(x.a)&&Array.isArray(x.b)){state.a=x.a.filter(Number.isInteger);state.b=x.b.filter(Number.isInteger);state.c=Array.isArray(x.c)?x.c.filter(Number.isInteger):[];if([15,30,45,60,90].includes(x.buffer))state.buffer=x.buffer;save();imported=true;state.view='favorites'}}catch(e){}}

document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;save();render()}));
document.getElementById('search').addEventListener('input',e=>{state.query=e.target.value;save();renderProgram()});
document.getElementById('regOnly').addEventListener('change',e=>{state.regOnly=e.target.checked;save();renderProgram()});
document.getElementById('locfilter').addEventListener('change',e=>{state.loc=e.target.value;save();renderProgram()});
importHash();setupFilters();render();
if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
